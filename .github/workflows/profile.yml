name: Refresh profile visuals

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/anon-stage.png'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate profile from public GitHub data
        run: python3 scripts/generate.py --username "$PROFILE_OWNER" --out dist
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated images to output branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            let previous;
            try {
              previous = (await github.rest.git.getRef({ owner, repo, ref: 'heads/output' })).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tree = [];
            for (const name of fs.readdirSync('dist').sort()) {
              if (!name.endsWith('.svg')) continue;
              const content = fs.readFileSync(`dist/${name}`).toString('base64');
              const blob = await github.rest.git.createBlob({ owner, repo, content, encoding: 'base64' });
              tree.push({ path: name, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            if (tree.length !== 5) throw new Error('Expected all five profile SVGs');
            const generated = await github.rest.git.createTree({ owner, repo, tree });
            // GITHUB_TOKEN uses the GitHub App identity. Do not supply personal authors or keys.
            const commit = await github.rest.git.createCommit({
              owner, repo, message: 'Refresh profile visuals', tree: generated.data.sha,
              parents: previous ? [previous] : [],
            });
            if (previous) {
              await github.rest.git.updateRef({ owner, repo, ref: 'heads/output', sha: commit.data.sha, force: false });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/output', sha: commit.data.sha });
            }
